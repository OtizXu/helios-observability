# =====================================================================
# Prometheus — Alert rules
# =====================================================================
# Each rule is an expression Prometheus evaluates every
# `evaluation_interval` (15s). If the expression returns a series
# AND stays truthy for `for:` duration, the alert fires.
#
# Annotations are human-readable text shown in Alertmanager / Telegram.
# Labels are how Alertmanager routes / groups alerts.
# =====================================================================

groups:

  # ---------------------------------------------------------------------
  # Host health — derived from node-exporter metrics
  # ---------------------------------------------------------------------
  - name: host-health
    rules:

      # ---- High CPU usage --------------------------------------------
      # Idle time across all CPUs averaged over 5m. If non-idle > 80%,
      # something is hammering the host.
      - alert: HighCpuUsage
        expr: |
          100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "High CPU on {{ $labels.host }} ({{ printf \"%.1f\" $value }}%)"
          description: |
            CPU usage on {{ $labels.host }} has stayed above 80% for 5 minutes.
            Current value: {{ printf "%.1f" $value }}%.

      # ---- Fast CPU spike(教學版,demo 用,short-window)---------------
      # 用 [1m] rate + for: 30s,讓短暫 spike 也能 fire,
      # 純粹是 lab 教學「完整 alert 循環」用。
      # Production 不該這樣寫(會 alert fatigue),正式規則是上面那條。
      - alert: HighCpuUsageDemo
        expr: |
          100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 60
        for: 30s
        labels:
          severity: info
          component: host
          purpose: demo
        annotations:
          summary: "[DEMO] CPU spike on {{ $labels.host }} ({{ printf \"%.1f\" $value }}%)"
          description: |
            Short-window CPU spike alert (lab demo only).
            Current value: {{ printf "%.1f" $value }}%.

      # ---- High memory usage -----------------------------------------
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "High memory on {{ $labels.host }} ({{ printf \"%.1f\" $value }}%)"
          description: |
            Memory usage above 85% for 5 minutes.
            Current value: {{ printf "%.1f" $value }}%.

      # ---- High system load(coverage gap fix)-----------------------
      # Load average 是「正在跑或等待 CPU 的 process 數」
      # 跟 CPU 使用率不同維度 — 高 load + 低 CPU = 大量 process 在等 IO
      # 業界經驗:load > 邏輯 CPU 數 持續 10 分鐘 = 系統忙到該擴容了
      - alert: HighSystemLoad
        expr: |
          node_load5 > count by (host) (
            count by (cpu, host) (node_cpu_seconds_total)
          )
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "High load on {{ $labels.host }} (load5={{ printf \"%.2f\" $value }})"
          description: |
            5-minute load average is higher than the number of logical CPUs.
            Could indicate CPU saturation or I/O wait.

      # ---- High disk usage -------------------------------------------
      # Triggers when any "real" filesystem is more than 85% full.
      # We exclude read-only / pseudo / overlay filesystems explicitly
      # because their used% is meaningless or always ~100% by design
      # (e.g. erofs is the macOS Docker Desktop VM's read-only root).
      - alert: HighDiskUsage
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|erofs|iso9660|fuse.*|nsfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|erofs|iso9660|fuse.*|nsfs"})) * 100 > 85
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.host }} at {{ printf \"%.1f\" $value }}%"
          description: |
            Filesystem {{ $labels.mountpoint }} ({{ $labels.fstype }}) on
            {{ $labels.host }} is over 85% full for 10 minutes.

      # ---- Host unreachable ------------------------------------------
      # `up` is 1 when scrape succeeds, 0 when it fails. If we lose the
      # node-exporter for 2m, the host is effectively dead.
      - alert: HostDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          component: host
        annotations:
          summary: "Host scrape failing for {{ $labels.instance }}"
          description: |
            Prometheus has been unable to scrape node-exporter at
            {{ $labels.instance }} for 2 minutes.

  # ---------------------------------------------------------------------
  # Observability stack health (the watchers watch the watchers)
  # ---------------------------------------------------------------------
  - name: observability-stack
    rules:

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          component: observability
        annotations:
          summary: "Scrape target down: {{ $labels.job }} ({{ $labels.instance }})"
          description: |
            Prometheus job '{{ $labels.job }}' target
            '{{ $labels.instance }}' has been down for 5 minutes.

      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          component: observability
        annotations:
          summary: "Alertmanager failing to send notifications"
          description: |
            Alertmanager has failed to deliver one or more notifications
            in the last 5 minutes. Check the receiver configuration.
