# =====================================================================
# Prometheus — Alert rules
# =====================================================================
# Each rule is an expression Prometheus evaluates every
# `evaluation_interval` (15s). If the expression returns a series
# AND stays truthy for `for:` duration, the alert fires.
#
# Annotations are human-readable text shown in Alertmanager / Telegram.
# Labels are how Alertmanager routes / groups alerts.
# =====================================================================

groups:

  # ---------------------------------------------------------------------
  # Host health — derived from node-exporter metrics
  # ---------------------------------------------------------------------
  - name: host-health
    rules:

      # ---- High CPU usage --------------------------------------------
      # Production rule: 5-min average above 80% sustained for 5 minutes.
      - alert: HighCpuUsage
        expr: 100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "High CPU on {{ $labels.host }} ({{ printf \"%.1f\" $value }}%)"
          description: "CPU usage on {{ $labels.host }} above 80% for 5+ minutes. Current: {{ printf \"%.1f\" $value }}%."

      # ---- Fast CPU spike (lab demo only) ----------------------------
      # Short-window rule for teaching: 1-min rate over 60% for 30 seconds.
      # Production should NOT use this (alert fatigue). Demo purpose only.
      - alert: HighCpuUsageDemo
        expr: 100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 60
        for: 30s
        labels:
          severity: info
          component: host
          purpose: demo
        annotations:
          summary: "[DEMO] CPU spike on {{ $labels.host }} ({{ printf \"%.1f\" $value }}%)"
          description: "Short-window CPU spike alert (lab demo only). Current: {{ printf \"%.1f\" $value }}%."

      # ---- High memory usage -----------------------------------------
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "High memory on {{ $labels.host }} ({{ printf \"%.1f\" $value }}%)"
          description: "Memory usage above 85% for 5+ minutes. Current: {{ printf \"%.1f\" $value }}%."

      # ---- High system load (coverage gap fix from TS-08) ------------
      # Load average is "processes running OR waiting for CPU".
      # Different dimension from CPU usage: high load + low CPU = I/O wait.
      # Industry rule of thumb: load > logical CPU count for 10+ min = saturation.
      - alert: HighSystemLoad
        expr: node_load5 > on(host) group_left count by (host) (node_cpu_seconds_total{mode="idle"})
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "High load on {{ $labels.host }} (load5={{ printf \"%.2f\" $value }})"
          description: "5-minute load average exceeds logical CPU count. Possible CPU saturation or I/O wait."

      # ---- High disk usage -------------------------------------------
      # Excludes read-only / pseudo / overlay filesystems whose used%
      # is meaningless or always ~100% by design (e.g. erofs in macOS
      # Docker Desktop VM root).
      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|erofs|iso9660|fuse.*|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|erofs|iso9660|fuse.*|nsfs"})) * 100 > 85
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.host }} at {{ printf \"%.1f\" $value }}%"
          description: "Filesystem {{ $labels.mountpoint }} ({{ $labels.fstype }}) on {{ $labels.host }} over 85% full for 10+ min."

      # ---- Host unreachable ------------------------------------------
      # `up` is 1 when scrape succeeds, 0 when it fails.
      # 2 minutes of failed scrapes = host effectively dead.
      - alert: HostDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          component: host
        annotations:
          summary: "Host scrape failing for {{ $labels.instance }}"
          description: "Prometheus unable to scrape node-exporter at {{ $labels.instance }} for 2+ minutes."

  # ---------------------------------------------------------------------
  # Observability stack health (the watchers watch the watchers)
  # ---------------------------------------------------------------------
  - name: observability-stack
    rules:

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          component: observability
        annotations:
          summary: "Scrape target down: {{ $labels.job }} ({{ $labels.instance }})"
          description: "Prometheus job '{{ $labels.job }}' target '{{ $labels.instance }}' down for 5+ minutes."

      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          component: observability
        annotations:
          summary: "Alertmanager failing to send notifications"
          description: "Alertmanager failed to deliver one or more notifications in the last 5 minutes."
