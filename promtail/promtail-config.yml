# =====================================================================
# Promtail — Log shipper config
# =====================================================================
# Promtail tails files on disk and pushes them to Loki via HTTP.
# `positions.yaml` records the byte offset for each file so Promtail
# can resume cleanly after restart.
#
# Two scrape jobs:
#   1. system   — tails /var/log/* on the host
#   2. docker   — tails Docker container logs (JSON-file driver)
# =====================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0  # disable grpc (we don't need it)
  log_level: info

# Where Promtail stores "last byte read" markers
positions:
  filename: /tmp/positions.yaml

# Where to push logs (the Loki we run alongside)
clients:
  - url: http://loki:3100/loki/api/v1/push

# =====================================================================
# scrape_configs — like Prometheus, but for files instead of /metrics
# =====================================================================
scrape_configs:

  # ---- 1. Host system logs --------------------------------------------
  # Tails plain text logs under /var/log/. Each file becomes a stream
  # in Loki, identified by labels {job, host, filename}.
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: helios-mac01
          __path__: /var/log/*log

  # ---- 2. Docker container logs ---------------------------------------
  # On Linux hosts (and Docker Desktop on Mac), container stdout/stderr
  # is written to /var/lib/docker/containers/<id>/<id>-json.log.
  # We tail those files and re-label them with container metadata.
  #
  # NOTE: on Docker Desktop for Mac, host paths like /var/lib/docker
  # may not be directly visible. If this scrape job ends up empty,
  # we'll switch to the Docker socket service-discovery method
  # (docker_sd_configs) — kept simple here for portability.
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: helios-mac01
          __path__: /var/lib/docker/containers/*/*log
    pipeline_stages:
      # Docker writes JSON like {"log":"...","stream":"stdout","time":"..."}
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
      - output:
          source: output
