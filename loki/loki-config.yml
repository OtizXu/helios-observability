# =====================================================================
# Loki — Single-binary, filesystem-backed configuration
# =====================================================================
# This config runs Loki in monolithic mode (all components in one
# process), with logs and indexes stored on local disk.
#
# For Stage 5 (federation), we'll switch to S3-compatible object
# storage (likely MinIO). For now, local volumes are fine.
# =====================================================================

auth_enabled: false  # Single-tenant lab; no X-Scope-OrgID required

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

# ---------------------------------------------------------------------
# Common settings shared across components
# ---------------------------------------------------------------------
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ---------------------------------------------------------------------
# Schema config — how chunks/index are organized over time.
# v13 + tsdb is the current recommended Loki 3.x setup.
# ---------------------------------------------------------------------
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# ---------------------------------------------------------------------
# Limits — sane defaults for a home lab
# ---------------------------------------------------------------------
limits_config:
  # Logs older than this are dropped at ingest time
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  # Don't accept logs from the future (clock skew protection)
  creation_grace_period: 10m
  # Per-tenant ingestion limits (we're single tenant, so global)
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  # Allow structured metadata in log lines (Loki 3.x feature)
  allow_structured_metadata: true
  # Keep query timeouts reasonable
  max_query_length: 721h    # 30 days
  max_query_parallelism: 32

# ---------------------------------------------------------------------
# Retention — how long logs stick around
# ---------------------------------------------------------------------
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# ---------------------------------------------------------------------
# Ingester — buffers logs before flushing to storage
# ---------------------------------------------------------------------
ingester:
  chunk_idle_period: 30m
  chunk_block_size: 262144
  chunk_target_size: 1572864
  max_chunk_age: 1h

# ---------------------------------------------------------------------
# Ruler — for log-based alerts (placeholder, no rules defined yet)
# ---------------------------------------------------------------------
ruler:
  alertmanager_url: http://alertmanager:9093

# ---------------------------------------------------------------------
# Telemetry — Loki "phones home" for usage stats by default. Disable.
# ---------------------------------------------------------------------
analytics:
  reporting_enabled: false
